<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>não apego — fotos</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #fafaf8; --surface: #fff; --border: #e8e4df;
      --text: #1a1a1a; --muted: #8a8580; --accent: #2d2d2d;
      --green: #25d366;
    }
    body { background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--text); padding-bottom: 40px; }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px 0;
      position: sticky; top: 0; z-index: 10;
    }
    .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .logo { font-size: 1rem; font-weight: 300; letter-spacing: 0.18em; }

    /* ── Contador ── */
    .counter-block { margin-bottom: 12px; }
    .counter-numbers { display: flex; align-items: baseline; gap: 6px; margin-bottom: 6px; }
    .counter-big { font-size: 1.8rem; font-weight: 700; line-height: 1; }
    .counter-label { font-size: 0.8rem; color: var(--muted); }
    .counter-done { font-size: 0.78rem; color: var(--green); font-weight: 500; }
    .progress-bar { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--green); border-radius: 2px; transition: width 0.4s ease; }

    /* ── Filtro closets ── */
    .closet-filter {
      display: flex; gap: 6px; overflow-x: auto; padding: 10px 0;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .closet-filter::-webkit-scrollbar { display: none; }

    /* ── Dica galeria ── */
    .gallery-hint {
      margin: 0 16px 0;
      padding: 8px 12px;
      background: #f0f7ff;
      border: 1px solid #cce0ff;
      border-radius: 8px;
      font-size: 0.75rem;
      color: #3a6ea8;
      line-height: 1.4;
    }

    /* ── Busca ── */
    .search-wrap { padding: 10px 16px 4px; }
    .search-input {
      width: 100%; padding: 9px 14px;
      border: 1px solid var(--border); border-radius: 100px;
      font-size: 0.85rem; background: var(--surface); color: var(--text);
      outline: none; -webkit-appearance: none;
    }
    .search-input:focus { border-color: var(--accent); }

    .filter-chip {
      flex-shrink: 0;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 100px;
      font-size: 0.78rem; font-weight: 500;
      background: var(--surface); color: var(--text);
      cursor: pointer; white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.15s;
    }
    .filter-chip.is-on { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* ── Lista ── */
    .list { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }

    /* ── Piece card ── */
    .piece-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex; align-items: center; gap: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.1s;
    }
    .piece-card:active { background: #f0ece8; }
    .piece-card.uploading { opacity: 0.5; pointer-events: none; }
    .piece-card.done { border-color: var(--green); }

    .thumb {
      width: 48px; height: 64px;
      border-radius: 6px; background: #f0ece8;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; overflow: hidden;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }

    .piece-info { flex: 1; min-width: 0; }
    .piece-id   { font-size: 0.68rem; color: var(--muted); font-weight: 600; letter-spacing: 0.06em; }
    .piece-desc { font-size: 0.85rem; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .piece-meta { font-size: 0.72rem; color: var(--muted); margin-top: 3px; }

    .add-icon {
      width: 30px; height: 30px;
      border: 1.5px dashed var(--border); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; color: var(--muted); flex-shrink: 0;
    }
    .piece-card.done .add-icon { border: none; color: var(--green); font-size: 1.1rem; }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 0.9rem; }
    .loading-state { text-align: center; padding: 60px 20px; color: var(--muted); }

    input[type="file"] { display: none; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--accent); color: #fff;
      padding: 10px 20px; border-radius: 8px; font-size: 0.85rem;
      opacity: 0; transition: opacity 0.2s;
      pointer-events: none; white-space: nowrap; z-index: 100;
    }
    .toast.show { opacity: 1; }

    /* ── Nova peça ── */
    .nova-wrap { padding: 16px; display: none; flex-direction: column; gap: 14px; max-width: 480px; margin: 0 auto; }
    .nova-wrap.show { display: flex; }
    .field label { display: block; font-size: 0.72rem; font-weight: 600; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 5px; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 10px 12px;
      border: 1px solid var(--border); border-radius: 8px;
      font-size: 0.95rem; background: var(--surface); color: var(--text);
      outline: none; -webkit-appearance: none; font-family: inherit;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
    .photo-strip { display: flex; gap: 8px; flex-wrap: wrap; }
    .photo-strip .ph {
      width: 72px; height: 96px; border-radius: 8px; overflow: hidden;
      background: #f0ece8; position: relative; flex-shrink: 0;
    }
    .photo-strip .ph img { width: 100%; height: 100%; object-fit: cover; }
    .photo-strip .ph .rm {
      position: absolute; top: 3px; right: 3px;
      width: 20px; height: 20px; border-radius: 50%;
      background: rgba(0,0,0,0.55); color: #fff; border: none;
      font-size: 0.75rem; line-height: 1; cursor: pointer;
    }
    .photo-add {
      width: 72px; height: 96px; border: 1.5px dashed var(--border); border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; color: var(--muted); background: none; cursor: pointer;
      -webkit-tap-highlight-color: transparent; flex-shrink: 0;
    }
    .btn {
      width: 100%; padding: 12px;
      border: none; border-radius: 8px;
      font-size: 0.95rem; font-weight: 500; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-dark { background: var(--accent); color: #fff; }
    .btn-outline { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn:disabled { opacity: 0.45; pointer-events: none; }
    .ia-note {
      padding: 10px 12px; background: #f0f7ff; border: 1px solid #cce0ff;
      border-radius: 8px; font-size: 0.8rem; color: #3a6ea8; line-height: 1.45;
      display: none;
    }
    .ia-note.show { display: block; }
    .nova-hint { font-size: 0.75rem; color: var(--muted); line-height: 1.4; }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="logo">não apego</div>
    <div style="display:flex;gap:6px;">
      <button class="filter-chip is-on" id="btn-sem-foto" onclick="setMode('sem-foto')">sem foto</button>
      <button class="filter-chip" id="btn-trocar" onclick="setMode('trocar')">trocar foto</button>
      <button class="filter-chip" id="btn-nova" onclick="setMode('nova')">➕ nova</button>
    </div>
  </div>
  <div class="counter-block" id="counter-block" style="display:none;">
    <div class="counter-numbers">
      <span class="counter-big" id="counter-remaining">—</span>
      <span class="counter-label">sem foto</span>
      <span class="counter-done" id="counter-done-label"></span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>
  <div class="closet-filter" id="closet-filter"></div>
</header>

<div class="gallery-hint" id="gallery-hint" style="display:none;">
  📷 Ao tocar numa peça, escolha <strong>Galeria</strong> ou <strong>Fotos</strong> — não "Câmera"
</div>
<div class="search-wrap" id="search-wrap" style="display:none;">
  <input class="search-input" id="search-input" type="search" placeholder="buscar por marca, descrição ou código…" autocomplete="off" />
</div>

<div id="app">
  <div class="loading-state">carregando peças…</div>
</div>

<!-- ── Cadastro de nova peça ── -->
<div class="nova-wrap" id="nova-wrap">
  <div class="nova-hint">
    📷 Tire fotos da peça (frente e verso) e <strong>da etiqueta interna</strong> — é dela que a IA lê a marca e o tamanho.
  </div>

  <div class="field">
    <label>Closet</label>
    <select id="nova-closet"></select>
    <input id="nova-closet-outro" type="text" placeholder="nome do closet" style="display:none;margin-top:8px;" />
  </div>

  <div class="field">
    <label>Fotos</label>
    <div class="photo-strip" id="nova-photos">
      <button class="photo-add" id="nova-photo-add">+</button>
    </div>
  </div>

  <button class="btn btn-outline" id="nova-analyze" disabled>✨ Analisar com IA</button>
  <div class="ia-note" id="nova-obs"></div>

  <div class="field"><label>Descritivo</label><input id="nova-desc" type="text" placeholder="ex: Vestido Midi Floral" /></div>
  <div style="display:flex;gap:10px;">
    <div class="field" style="flex:1;"><label>Marca</label><input id="nova-marca" type="text" /></div>
    <div class="field" style="width:90px;"><label>Tamanho</label><input id="nova-tam" type="text" /></div>
  </div>
  <div style="display:flex;gap:10px;">
    <div class="field" style="flex:1;"><label>Cor</label><input id="nova-cor" type="text" /></div>
    <div class="field" style="flex:1;"><label>Preço (R$)</label><input id="nova-preco" type="text" inputmode="decimal" placeholder="0,00" /></div>
  </div>

  <button class="btn btn-dark" id="nova-save" disabled>Salvar no catálogo</button>
</div>

<input type="file" id="filePicker" accept="image/*" />
<input type="file" id="novaPicker" accept="image/*" multiple />
<div class="toast" id="toast"></div>

<script>
  let allPieces    = [];
  let activePiece  = null;
  let activeCloset = 'todos';
  let searchQuery  = '';
  let totalOriginal = 0;
  let mode         = 'sem-foto'; // 'sem-foto' | 'trocar'

  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = e => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          const MAX = 1200;
          let { width, height } = img;
          if (width > MAX || height > MAX) {
            if (width > height) { height = Math.round(height * MAX / width); width = MAX; }
            else                { width  = Math.round(width  * MAX / height); height = MAX; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve({ base64: canvas.toDataURL('image/jpeg', 0.82).split(',')[1], mimeType: 'image/jpeg' });
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function showToast(msg, duration = 2500) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), duration);
  }

  function formatPrice(raw) {
    const n = parseFloat(String(raw).replace(/[R$\s"]/g, '').replace(',', '.'));
    return isNaN(n) ? '' : 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: 0 });
  }

  function visiblePieces() {
    return mode === 'sem-foto'
      ? allPieces.filter(p => !p.hasPhoto && !p.done)
      : allPieces.filter(p => p.hasPhoto && !p.done);
  }

  function updateCounter() {
    const list      = allPieces.filter(p => !p.hasPhoto);
    const remaining = list.filter(p => !p.done).length;
    const done      = totalOriginal - remaining;
    const pct       = totalOriginal > 0 ? Math.round(done / totalOriginal * 100) : 0;

    document.getElementById('counter-remaining').textContent = remaining;
    document.getElementById('counter-done-label').textContent = done > 0 ? `· ${done} enviada${done > 1 ? 's' : ''}` : '';
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('counter-block').style.display = mode === 'sem-foto' ? 'block' : 'none';
  }

  function getClosets() {
    const closets = [...new Set(allPieces.map(p => p.closet))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
    return closets;
  }

  function renderFilter() {
    const closets = getClosets();
    const vis = visiblePieces();
    document.getElementById('closet-filter').innerHTML = [
      `<button class="filter-chip is-on" data-closet="todos">todas (${vis.length})</button>`,
      ...closets.map(c => {
        const count = vis.filter(p => p.closet === c).length;
        return count > 0
          ? `<button class="filter-chip" data-closet="${c}">${c} (${count})</button>`
          : '';
      })
    ].filter(Boolean).join('');

    document.querySelectorAll('.filter-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('is-on'));
        btn.classList.add('is-on');
        activeCloset = btn.dataset.closet;
        renderList();
      });
    });
  }

  function renderList() {
    const app = document.getElementById('app');
    const q = searchQuery.toLowerCase();
    const list = visiblePieces().filter(p =>
      (activeCloset === 'todos' || p.closet === activeCloset) &&
      (!q || p.desc.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q) || p.id.toLowerCase().includes(q))
    );

    if (!list.length) {
      app.innerHTML = mode === 'sem-foto'
        ? `<div class="empty">🎉 Todas as peças têm foto!</div>`
        : `<div class="empty">Nenhuma peça com foto neste closet.</div>`;
      return;
    }

    app.innerHTML = `<div class="list">${list.map(p => `
      <div class="piece-card" data-row="${p.row}" id="card-${p.row}">
        <div class="thumb" id="thumb-${p.row}">
          ${p.localPreview ? `<img src="${p.localPreview}">` : p.photoUrl ? `<img src="${p.photoUrl}">` : '👗'}
        </div>
        <div class="piece-info">
          <div class="piece-id">${p.id} · ${p.closet}</div>
          <div class="piece-desc">${p.desc}</div>
          <div class="piece-meta">${[p.brand, p.size, formatPrice(p.price)].filter(Boolean).join(' · ')}</div>
        </div>
        <div class="add-icon" id="icon-${p.row}">${p.hasPhoto ? '↺' : '+'}</div>
      </div>`).join('')}</div>`;

    document.querySelectorAll('.piece-card').forEach(card => {
      card.addEventListener('click', () => {
        const row = parseInt(card.dataset.row);
        activePiece = allPieces.find(p => p.row === row);
        document.getElementById('filePicker').value = '';
        document.getElementById('filePicker').click();
      });
    });
  }

  document.getElementById('filePicker').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file || !activePiece) return;

    const piece = activePiece;
    const card  = document.getElementById('card-' + piece.row);
    const icon  = document.getElementById('icon-' + piece.row);
    const thumb = document.getElementById('thumb-' + piece.row);

    thumb.innerHTML = `<img src="${URL.createObjectURL(file)}">`;
    card.classList.add('uploading');
    icon.innerHTML = '<div class="spinner"></div>';

    try {
      const { base64, mimeType } = await compressImage(file);
      await new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .savePhoto(piece.row, base64, mimeType, piece.id);
      });

      piece.done = true;
      card.classList.remove('uploading');
      card.classList.add('done');
      icon.textContent = '✓';
      showToast(`${piece.id} salvo ✓`);
      updateCounter();
      renderFilter();

      setTimeout(() => {
        card.style.transition = 'opacity 0.3s';
        card.style.opacity = '0';
        setTimeout(() => {
          card.remove();
          if (!document.querySelector('.piece-card')) renderList();
        }, 300);
      }, 1200);

    } catch (err) {
      card.classList.remove('uploading');
      icon.textContent = '+';
      thumb.innerHTML = '👗';
      piece.localPreview = null;
      showToast('Erro ao salvar. Tente novamente.');
      console.error(err);
    }
  });

  // Busca
  document.getElementById('search-input').addEventListener('input', e => {
    searchQuery = e.target.value.trim();
    renderList();
  });

  function setMode(m) {
    mode = m;
    document.getElementById('btn-sem-foto').classList.toggle('is-on', m === 'sem-foto');
    document.getElementById('btn-trocar').classList.toggle('is-on', m === 'trocar');
    document.getElementById('btn-nova').classList.toggle('is-on', m === 'nova');

    const isNova = m === 'nova';
    document.getElementById('nova-wrap').classList.toggle('show', isNova);
    document.getElementById('app').style.display = isNova ? 'none' : 'block';
    document.getElementById('closet-filter').style.display = isNova ? 'none' : 'flex';
    document.getElementById('gallery-hint').style.display = isNova ? 'none' : 'block';
    document.getElementById('search-wrap').style.display = isNova ? 'none' : 'block';
    if (isNova) {
      document.getElementById('counter-block').style.display = 'none';
      return;
    }

    activeCloset = 'todos';
    searchQuery = '';
    document.getElementById('search-input') && (document.getElementById('search-input').value = '');
    updateCounter();
    renderFilter();
    renderList();
  }

  // ── Cadastro de nova peça ──────────────────────────────────
  const nova = { photos: [], saving: false };

  function populateClosetSelect() {
    const sel = document.getElementById('nova-closet');
    const closets = getClosets();
    sel.innerHTML =
      '<option value="" disabled selected>selecione…</option>' +
      closets.map(c => `<option value="${c}">${c}</option>`).join('') +
      '<option value="__outro__">outro closet…</option>';
  }

  document.getElementById('nova-closet').addEventListener('change', e => {
    document.getElementById('nova-closet-outro').style.display =
      e.target.value === '__outro__' ? 'block' : 'none';
    updateNovaButtons();
  });

  function novaClosetValue() {
    const sel = document.getElementById('nova-closet').value;
    if (sel === '__outro__') return document.getElementById('nova-closet-outro').value.trim();
    return sel;
  }

  function updateNovaButtons() {
    document.getElementById('nova-analyze').disabled = !nova.photos.length || nova.saving;
    const preco = document.getElementById('nova-preco').value.trim();
    const desc  = document.getElementById('nova-desc').value.trim();
    document.getElementById('nova-save').disabled =
      !nova.photos.length || !novaClosetValue() || !desc || !preco || nova.saving;
  }

  ['nova-preco', 'nova-desc', 'nova-closet-outro'].forEach(id =>
    document.getElementById(id).addEventListener('input', updateNovaButtons));

  function renderNovaPhotos() {
    const strip = document.getElementById('nova-photos');
    strip.innerHTML = nova.photos.map((p, i) => `
      <div class="ph"><img src="${p.previewUrl}"><button class="rm" data-i="${i}">✕</button></div>
    `).join('') + '<button class="photo-add" id="nova-photo-add">+</button>';

    strip.querySelectorAll('.rm').forEach(btn =>
      btn.addEventListener('click', () => {
        nova.photos.splice(parseInt(btn.dataset.i), 1);
        renderNovaPhotos();
        updateNovaButtons();
      }));
    document.getElementById('nova-photo-add').addEventListener('click', () => {
      document.getElementById('novaPicker').value = '';
      document.getElementById('novaPicker').click();
    });
  }

  document.getElementById('nova-photo-add').addEventListener('click', () => {
    document.getElementById('novaPicker').value = '';
    document.getElementById('novaPicker').click();
  });

  document.getElementById('novaPicker').addEventListener('change', async e => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    for (const file of files) {
      try {
        const { base64, mimeType } = await compressImage(file);
        nova.photos.push({ base64, mimeType, previewUrl: URL.createObjectURL(file) });
      } catch (err) {
        showToast('Erro ao processar uma foto.');
      }
    }
    renderNovaPhotos();
    updateNovaButtons();
  });

  document.getElementById('nova-analyze').addEventListener('click', () => {
    const btn = document.getElementById('nova-analyze');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div> analisando…';

    google.script.run
      .withSuccessHandler(res => {
        if (res.descritivo) document.getElementById('nova-desc').value  = res.descritivo;
        if (res.marca)      document.getElementById('nova-marca').value = res.marca;
        if (res.tamanho)    document.getElementById('nova-tam').value   = res.tamanho;
        if (res.cor)        document.getElementById('nova-cor').value   = res.cor;
        const obs = document.getElementById('nova-obs');
        if (res.observacoes) { obs.textContent = '💡 ' + res.observacoes; obs.classList.add('show'); }
        btn.innerHTML = '✨ Analisar com IA';
        updateNovaButtons();
        showToast('Confira os campos e ajuste se precisar ✓');
      })
      .withFailureHandler(err => {
        btn.innerHTML = '✨ Analisar com IA';
        updateNovaButtons();
        showToast('IA indisponível — preencha manualmente.');
        console.error(err);
      })
      .analyzeNewPiece(nova.photos.map(p => ({ base64: p.base64, mimeType: p.mimeType })));
  });

  document.getElementById('nova-save').addEventListener('click', () => {
    const btn = document.getElementById('nova-save');
    nova.saving = true;
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner" style="border-top-color:#fff;"></div> salvando…';

    const payload = {
      closet: novaClosetValue(),
      marca:  document.getElementById('nova-marca').value.trim(),
      descritivo: document.getElementById('nova-desc').value.trim(),
      tamanho: document.getElementById('nova-tam').value.trim(),
      cor:    document.getElementById('nova-cor').value.trim(),
      preco:  document.getElementById('nova-preco').value.trim(),
      fotos:  nova.photos.map(p => ({ base64: p.base64, mimeType: p.mimeType })),
    };

    google.script.run
      .withSuccessHandler(codigo => {
        nova.saving = false;
        nova.photos = [];
        renderNovaPhotos();
        ['nova-desc','nova-marca','nova-tam','nova-cor','nova-preco'].forEach(id =>
          document.getElementById(id).value = '');
        const obs = document.getElementById('nova-obs');
        obs.textContent = ''; obs.classList.remove('show');
        btn.innerHTML = 'Salvar no catálogo';
        updateNovaButtons();
        showToast(`${codigo} cadastrada no catálogo ✓`, 3500);
      })
      .withFailureHandler(err => {
        nova.saving = false;
        btn.innerHTML = 'Salvar no catálogo';
        updateNovaButtons();
        showToast('Erro: ' + (err.message || 'tente novamente'), 4000);
        console.error(err);
      })
      .createPiece(payload);
  });

  google.script.run
    .withSuccessHandler(data => {
      allPieces     = data;
      totalOriginal = data.filter(p => !p.hasPhoto).length;
      updateCounter();
      renderFilter();
      renderList();
      populateClosetSelect();
      document.getElementById('gallery-hint').style.display = 'block';
      document.getElementById('search-wrap').style.display  = 'block';
    })
    .withFailureHandler(err => {
      document.getElementById('app').innerHTML =
        `<div class="empty">Erro ao carregar.<br><small>${err.message}</small></div>`;
    })
    .getPieces();
</script>
</body>
</html>
